; The texture streaming pool, by texture quality: what the game's maps need,
; with room to spare, and never more than the graphics card's memory allows
; (r.Streaming.LimitPoolSizeToVRAM). The Creamery, with its bodies, bots and
; rats, needs about 135 MB of streamed mips at 1080 lines (`stat streaming`:
; Required Pool), while the engine's own pool at high quality is 1000 MB,
; which fills with cached mips; a pool a few times what is needed leaves the
; rest of the card's memory to the frame.
[TextureQuality@0]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=250

[TextureQuality@1]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=350

[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=450

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=600

[TextureQuality@Cine]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1000
