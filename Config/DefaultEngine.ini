; Matches are hosted and joined through Steam (docs/unreal/spike.md, day 6):
; sessions are Steam lobbies, and the game's traffic goes over Steam's relay
; through the Steam net driver. The app id is Steam's public test app
; ("Spacewar", 480) until the game has one of its own. The Steam client must
; be running; without it, or with -NOSTEAM, the Null service takes over,
; which can only host and find games on the local network. The editor
; always plays with Null; only -game and packaged builds use Steam.
[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
; A match is a lobby between players' own Steam identities; no Steam game
; server is started, so two games can run on one PC (for trying it out).
bInitServerOnClient=false
bRelaunchInSteam=false

