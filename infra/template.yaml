AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  CheeseStrike's backend: the session server (signaling) and the bucket the
  game is served from. Nothing here runs, or costs anything, while nobody is
  playing. docs/backend.md describes it; infra/deploy.py deploys it.

Resources:
  # Sessions and connections. Laid out as SCHEMA in signaling/dynamo_store.py,
  # which infra/test_template.py checks.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
        - AttributeName: listed
          AttributeType: S
        - AttributeName: created
          AttributeType: "N"
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_owner
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - expires
        - IndexName: listed
          KeySchema:
            - AttributeName: listed
              KeyType: HASH
            - AttributeName: created
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  # The signaling rules. One function, called by the WebSocket API for hosts
  # and players joining, and through its own URL for the session list.
  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../signaling
      Handler: aws_lambda.handler
      Runtime: python3.14
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET

  # A function URL open to everyone needs this as well as the permission to
  # use the URL, which the FunctionUrlConfig above adds.
  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Holds the WebSocket connections and calls the function for each event.
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-signaling
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.type

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${WebSocketIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WebSocketIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${WebSocketIntegration}

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true
      # A ceiling on messages across all players, so a flood can't run up a bill.
      DefaultRouteSettings:
        ThrottlingRateLimit: 200
        ThrottlingBurstLimit: 400

  WebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # The game's files, readable by anyone. infra/deploy.py uploads them.
  GameBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  GameBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref GameBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${GameBucket.Arn}/*

Outputs:
  SignalUrl:
    Description: Where hosts and players joining connect (WebSocket).
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${WebSocketStage}
  SessionsUrl:
    Description: Where the session list is read from (HTTPS).
    Value: !GetAtt FunctionUrl.FunctionUrl
  GameBucket:
    Description: The bucket the game's files go in.
    Value: !Ref GameBucket
  GameUrl:
    Description: The address to play at.
    Value: !Sub https://${GameBucket.RegionalDomainName}/index.html
