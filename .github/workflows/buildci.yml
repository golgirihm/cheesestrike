name: buildci command

# Commenting "buildci" on a pull request runs the tests on that pull request's
# latest commit, so that the pull request ends up with one set of results
# however they were produced.
#
# If the tests already ran automatically for that commit, the command restarts
# that same run, cancelling it first if it is still going. Its checks are
# replaced in place.
#
# If they never ran for that commit, as when automatic runs are turned off, the
# test jobs run inside this workflow instead. A comment-triggered run is not
# tied to the pull request, so each result is reported as a commit status under
# the job's name, which is also the name of the required check.
#
# Anyone may use it, on any pull request including one from a fork. The jobs
# that run the pull request's code get a read-only token and no secrets, the
# same as its automatic test runs. The jobs that can write statuses or restart
# runs never check the code out.

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  # Must match the job names in tests.yml.
  CONTEXTS: |
    Game tests
    Signaling tests

jobs:
  prepare:
    name: Read the command
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'buildci')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      statuses: write
    outputs:
      # Set only when the tests have to run inside this workflow.
      sha: ${{ steps.command.outputs.sha }}
    env:
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: command
        name: Restart the pull request's test run, or prepare to run the tests here
        run: |
          # The whole comment must be the command, give or take whitespace.
          if [ "$(printf '%s' "$COMMENT_BODY" | tr -d '[:space:]')" != "buildci" ]; then
            echo "Comment is not exactly 'buildci'; ignoring."
            exit 0
          fi

          react() {
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$1" --silent
          }

          if [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" != "OPEN" ]; then
            echo "::error::Pull request #$PR is not open."
            react confused
            exit 1
          fi

          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run=$(gh run list --repo "$REPO" --workflow tests.yml --event pull_request --commit "$sha" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')

          if [ -n "$run" ]; then
            status=$(gh run view "$run" --repo "$REPO" --json status --jq .status)
            if [ "$status" != "completed" ]; then
              echo "Test run $run is $status; cancelling it before restarting."
              gh run cancel "$run" --repo "$REPO" || true
              for _ in $(seq 60); do
                status=$(gh run view "$run" --repo "$REPO" --json status --jq .status)
                [ "$status" = "completed" ] && break
                sleep 2
              done
            fi
            gh run rerun "$run" --repo "$REPO"
            echo "Restarted test run $run."
            react rocket
            exit 0
          fi

          echo "No test run exists for $sha; running the tests in this workflow."
          while IFS= read -r context; do
            [ -n "$context" ] || continue
            gh api -X POST "repos/$REPO/statuses/$sha" --silent \
              -f state=pending -f context="$context" \
              -f description="Running (buildci)" -f target_url="$RUN_URL"
          done <<< "$CONTEXTS"
          react rocket
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tests:
    name: tests
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  report:
    name: Report results
    needs: [prepare, tests]
    if: always() && needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report each test job's result as a commit status
        run: |
          # This run's jobs, as "<name><tab><conclusion>". The test jobs appear
          # as "tests / <job name>".
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          echo "$jobs"

          while IFS= read -r context; do
            [ -n "$context" ] || continue
            conclusion=$(printf '%s\n' "$jobs" | awk -F '\t' -v name="tests / $context" '$1 == name { print $2 }' | tail -n 1)
            case "$conclusion" in
              success) state=success; description="Passed (buildci)" ;;
              failure) state=failure; description="Failed (buildci)" ;;
              cancelled)
                # Superseded by a newer run, which reports for itself.
                echo "$context: cancelled, leaving its status alone"
                continue ;;
              *) state=error; description="Did not finish (buildci)" ;;
            esac
            gh api -X POST "repos/$REPO/statuses/$SHA" --silent \
              -f state="$state" -f context="$context" \
              -f description="$description" -f target_url="$RUN_URL"
            echo "$context: $state"
          done <<< "$CONTEXTS"
