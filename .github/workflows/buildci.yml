name: buildci command

# Commenting "buildci" on a pull request re-runs the Tests workflow for that
# pull request's latest commit. It re-runs the pull request's own test run
# rather than starting a separate one, because GitHub only shows runs made for
# the pull request in its checks.
#
# Anyone may use it. That is safe because a re-run executes the same code with
# the same read-only token as the run it repeats.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  start:
    name: Re-run tests
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'buildci')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Re-run the pull request's test run
        run: |
          # The whole comment must be the command, give or take whitespace.
          if [ "$(printf '%s' "$COMMENT_BODY" | tr -d '[:space:]')" != "buildci" ]; then
            echo "Comment is not exactly 'buildci'; ignoring."
            exit 0
          fi

          react() {
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$1" --silent
          }

          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run=$(gh run list --repo "$REPO" --workflow tests.yml --event pull_request --commit "$sha" \
            --limit 1 --json databaseId,status --jq '.[0] // empty | "\(.databaseId) \(.status)"')

          if [ -z "$run" ]; then
            echo "::error::No test run exists for the latest commit of pull request #$PR, so there is nothing to re-run."
            react confused
            exit 1
          fi

          id=${run%% *}
          status=${run##* }
          if [ "$status" != "completed" ]; then
            echo "Test run $id is already $status; leaving it alone."
            react eyes
            exit 0
          fi

          gh run rerun "$id" --repo "$REPO"
          react rocket
