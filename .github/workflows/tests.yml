name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets the buildci command workflow run these jobs on a pull request's commit.
  workflow_call:
    inputs:
      ref:
        description: Commit to test. Defaults to the one that triggered the workflow.
        type: string
        default: ""

permissions:
  contents: read

# One run at a time per pull request, whether it was started automatically or
# by the buildci command: a newer one cancels one still in progress. Elsewhere
# it is one per branch. Runs for a push to main always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# The runner image, the actions, Python, Godot and the Python packages are
# pinned so that a commit is tested the same way each time. The Python and
# Godot versions come from tools/versions.env, which tools/run_tests.py also
# reads to warn about a local run that differs. Dependabot proposes updates to
# the actions and packages.

# The job names are the names of the checks on a pull request, and the buildci
# command workflow reports results under the same names. Each job has a limit
# well beyond how long it takes, so that one that has stalled fails within the
# hour rather than holding a pull request up for six.
jobs:
  game:
    name: Game tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Load pinned versions
        run: grep -Ev '^(#|$)' tools/versions.env >> "$GITHUB_ENV"
      # The pinned Python is rarely the release the runner image ships, and
      # downloading it takes several seconds, so it is kept in a cache.
      - name: Restore cached Python
        id: python-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}
          key: python-${{ env.PYTHON_VERSION }}-ubuntu-24.04-${{ runner.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha256sum --check
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - run: python tools/run_tests.py game

  signaling:
    name: Signaling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Load pinned versions
        run: grep -Ev '^(#|$)' tools/versions.env >> "$GITHUB_ENV"
      # The pinned Python is rarely the release the runner image ships, and
      # downloading it takes several seconds, so it is kept in a cache.
      - name: Restore cached Python
        id: python-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}
          key: python-${{ env.PYTHON_VERSION }}-ubuntu-24.04-${{ runner.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Only trusted runs on main write the cache, and before any repository
      # code has run. Pull request code, including a fork's run through the
      # buildci command, can read the cache but never fill it.
      - name: Save Python to the cache
        if: >-
          steps.python-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}
          key: python-${{ env.PYTHON_VERSION }}-ubuntu-24.04-${{ runner.arch }}
      - run: pip install -r signaling/requirements-test.txt
      # The infra tests are quick and need the same packages, so they share this job.
      - run: python tools/run_tests.py signaling infra

  # Exports the web build and plays it in headless browser windows. The tests
  # are limited by processor time, so they are split between several
  # machines, each exporting the build for itself and running its share.
  browser-shard:
    name: Browser tests ${{ matrix.shard }} of 8
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Load pinned versions
        run: grep -Ev '^(#|$)' tools/versions.env >> "$GITHUB_ENV"
      - name: Restore cached Python
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}
          key: python-${{ env.PYTHON_VERSION }}-ubuntu-24.04-${{ runner.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha256sum --check
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      # Fetches only the Web template out of Godot's export templates archive,
      # and checks it against the pinned hash.
      - name: Install Godot's Web export template
        run: python tools/fetch_export_template.py
      - run: pip install -r signaling/requirements.txt -r browser_tests/requirements.txt
      # The Playwright version pins the browser build it downloads.
      - name: Install the browser
        run: python -m playwright install --only-shell chromium
      - run: python tools/run_tests.py browser --shard ${{ matrix.shard }}/8

  # The one check that stands for all the shards, under the name the buildci
  # command and the branch rules know.
  browser:
    name: Browser tests
    needs: browser-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass only if every shard passed
        env:
          RESULT: ${{ needs.browser-shard.result }}
        run: |
          echo "The shards' result: $RESULT"
          [ "$RESULT" = success ]
