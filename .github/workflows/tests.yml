name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets the buildci command workflow run these jobs on a pull request's commit.
  workflow_call:
    inputs:
      ref:
        description: Commit to test. Defaults to the one that triggered the workflow.
        type: string
        default: ""

permissions:
  contents: read

# One run at a time per pull request, whether it was started automatically or
# by the buildci command: a newer one cancels one still in progress. Elsewhere
# it is one per branch. Runs for a push to main always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# The runner image, the actions, Python, Godot and the Python packages are
# pinned so that a commit is tested the same way each time. The Python and
# Godot versions come from tools/versions.env, which tools/run_tests.py also
# reads to warn about a local run that differs. Dependabot proposes updates to
# the actions and packages.

# The job names are the names of the required checks on main, and the buildci
# command workflow reports results under the same names.
jobs:
  game:
    name: Game tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Load pinned versions
        run: grep -Ev '^(#|$)' tools/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha256sum --check
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - run: python tools/run_tests.py game

  signaling:
    name: Signaling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Load pinned versions
        run: grep -Ev '^(#|$)' tools/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r signaling/requirements.txt
      - run: python tools/run_tests.py signaling
